<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Producto | PowerStore</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">
                POWER<span>STORE</span>
            </a>


            <nav class="nav">

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a href="index.html#categorias">
                    Categorías
                </a>

            </nav>


            <a
                href="carrito.html"
                class="cart-button"
            >

                🛒

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- ================= PRODUCTO ================= -->

    <main>

        <section class="product-detail">

            <div
                class="container"
                id="product-container"
            >

                <!--

                    JavaScript va a insertar
                    el producto acá.

                -->

            </div>

        </section>


        <!-- ================= PRODUCTOS RELACIONADOS ================= -->

        <section class="related-products">

            <div class="container">

                <div class="section-title">

                    <p>
                        TAMBIÉN TE PUEDE INTERESAR
                    </p>

                    <h2>
                        Productos relacionados
                    </h2>

                </div>


                <div
                    id="related-products-grid"
                    class="product-grid"
                >
                </div>

            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container footer-content">

            <div>

                <a
                    href="index.html"
                    class="logo"
                >
                    POWER<span>STORE</span>
                </a>

                <p>
                    Suplementación deportiva para todos.
                </p>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 PowerStore.
                Todos los derechos reservados.
            </p>

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/productos.js"></script>

    <script src="js/tienda.js"></script>

    <script src="js/producto.js"></script>

</body>

</html>
