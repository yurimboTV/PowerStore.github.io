<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Productos | PowerStore</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">
                POWER<span>STORE</span>
            </a>


            <nav class="nav">

                <a href="index.html">
                    Inicio
                </a>

                <a
                    href="productos.html"
                    class="active"
                >
                    Productos
                </a>

                <a href="index.html#categorias">
                    Categorías
                </a>

            </nav>


            <a
                href="carrito.html"
                class="cart-button"
            >

                🛒

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </header>



    <!-- ================= CATÁLOGO ================= -->

    <main>

        <section class="catalog">

            <div class="container">


                <!-- TÍTULO -->

                <div class="catalog-header">

                    <div class="section-title">

                        <p>
                            NUESTRO CATÁLOGO
                        </p>

                        <h1>
                            Productos
                        </h1>

                    </div>

                    <p
                        id="product-count"
                        class="product-count"
                    >
                        0 productos
                    </p>

                </div>



                <!-- ================= FILTROS ================= -->

                <div class="filters">


                    <!-- BUSCADOR -->

                    <div class="search-box">

                        <span>
                            🔎
                        </span>

                        <input
                            type="text"
                            id="search-input"
                            placeholder="Buscar productos..."
                        >

                    </div>



                    <!-- CATEGORÍA -->

                    <select id="category-filter">

                        <option value="Todos">
                            Todas las categorías
                        </option>

                        <option value="Proteinas">
                            Proteínas
                        </option>

                        <option value="Creatina">
                            Creatina
                        </option>

                        <option value="Pre-entreno">
                            Pre-entreno
                        </option>

                        <option value="Vitaminas">
                            Vitaminas
                        </option>

                        <option value="Recuperacion">
                            Recuperación
                        </option>

                    </select>



                    <!-- ORDEN -->

                    <select id="sort-filter">

                        <option value="default">
                            Ordenar por
                        </option>

                        <option value="price-low">
                            Precio: menor a mayor
                        </option>

                        <option value="price-high">
                            Precio: mayor a menor
                        </option>

                        <option value="name">
                            Nombre: A-Z
                        </option>

                    </select>



                    <!-- LIMPIAR -->

                    <button
                        id="clear-filters"
                        class="clear-filters"
                    >
                        Limpiar filtros
                    </button>

                </div>



                <!-- ================= PRODUCTOS ================= -->

                <div
                    id="catalog-products"
                    class="product-grid catalog-grid"
                >
                </div>



                <!-- ================= SIN RESULTADOS ================= -->

                <div
                    id="no-results"
                    class="no-results"
                    hidden
                >

                    <div class="no-results-icon">
                        🔍
                    </div>

                    <h2>
                        No encontramos productos
                    </h2>

                    <p>
                        Probá con otro nombre o categoría.
                    </p>

                    <button
                        id="clear-filters-empty"
                        class="btn btn-primary"
                    >
                        Limpiar filtros
                    </button>

                </div>


            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container footer-content">


            <div>

                <a
                    href="index.html"
                    class="logo"
                >
                    POWER<span>STORE</span>
                </a>

                <p>
                    Suplementación deportiva para todos.
                </p>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 PowerStore.
                Todos los derechos reservados.
            </p>

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/productos.js"></script>

    <script src="js/tienda.js"></script>

</body>

</html>
